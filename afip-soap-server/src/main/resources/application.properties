spring.application.name=afip-soap-server
server.port=8081

# ===== AFIP REGISTRY =====
# Every authorized invoice is stored here: it drives the correlative numbering
# and lets a resent invoice get its original CAE back.
# File-based H2 so numbering survives restarts (a Docker volume in docker compose).
spring.datasource.url=${AFIP_DB_URL:jdbc:h2:file:./data/afip-db}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
