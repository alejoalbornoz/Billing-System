spring.application.name=billing-client
server.port=8080

# ===== DATABASE =====
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_db?TimeZone=UTC
spring.datasource.username=billing_user
spring.datasource.password=billing_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== AFIP SOAP =====
afip.soap.url=http://localhost:8081/ws/invoice
afip.soap.wsdl=http://localhost:8081/ws/invoice.wsdl
afip.soap.connect-timeout-ms=5000
afip.soap.read-timeout-ms=10000

# ===== AFIP RETRY =====
# Invoices left PENDING (AFIP unreachable) are resent every interval.
# min-age must be longer than connect + read timeout, so an invoice whose
# first AFIP call is still in progress is never sent twice.
afip.retry.interval-ms=60000
afip.retry.min-age-ms=120000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


#Security JWT
jwt.secret=3f8a1c2e4b7d9f0a2c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1
jwt.expiration=86400000

# ===== INITIAL ADMIN =====
# Created on startup only when no ADMIN user exists yet (see AdminInitializer).
# Override with the ADMIN_EMAIL / ADMIN_PASSWORD environment variables.
app.admin.email=${ADMIN_EMAIL:admin@billing.com}
app.admin.password=${ADMIN_PASSWORD:admin12345}