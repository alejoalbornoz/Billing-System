spring.application.name=billing-client
server.port=8080

# Every ${VAR:default} below can be overridden with an environment variable.
# The defaults are meant for local development (docker compose maps Postgres to 5433).

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/billing_db?TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:billing_user}
spring.datasource.password=${DB_PASSWORD:billing_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== AFIP SOAP =====
afip.soap.url=${AFIP_SOAP_URL:http://localhost:8081/ws/invoice}
afip.soap.connect-timeout-ms=5000
afip.soap.read-timeout-ms=10000

# ===== AFIP RETRY =====
# Invoices left PENDING (AFIP unreachable) are resent every interval.
# min-age must be longer than connect + read timeout, so an invoice whose
# first AFIP call is still in progress is never sent twice.
afip.retry.interval-ms=60000
afip.retry.min-age-ms=120000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


#Security JWT
# The default is for local development only: set JWT_SECRET (64+ characters) anywhere else.
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-set-the-JWT_SECRET-env-var-in-any-real-environment}
jwt.expiration=86400000

# ===== INITIAL ADMIN =====
# Created on startup only when no ADMIN user exists yet (see AdminInitializer).
# Override with the ADMIN_EMAIL / ADMIN_PASSWORD environment variables.
app.admin.email=${ADMIN_EMAIL:admin@billing.com}
app.admin.password=${ADMIN_PASSWORD:admin12345}
