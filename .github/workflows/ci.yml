name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [afip-soap-server, billing-client]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # Runs unit tests and the Testcontainers integration tests (Docker is available on the runner)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build
